[package]
name = "tracing-callsite-source"
version = "0.1.0"
edition = "2018"
rust-version = "1.71.0"
publish = false

[lib]
proc-macro = true

[dependencies]
# Parse field expressions without splitting commas inside Rust expressions.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[lints]
workspace = true
